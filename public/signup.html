<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h2>Student Registration Portal</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="signup.html">Signup</a>
            <a href="login.html">Login</a>
        </div>
    </div>

    <div class="card-container">
        <h3 class="text-center mb-4">Student Signup Form</h3>
        <div id="error-msg" class="alert alert-danger alert-dismissible fade show" style="display: none;">
            This email is already registered.
            <button type="button" class="btn-close" onclick="document.getElementById('error-msg').style.display='none'"></button>
        </div>
        <div id="success-msg" class="alert alert-success"></div>

        <form id="signup-form" enctype="multipart/form-data">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" minlength="10" required autocomplete="new-password">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="dob" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Gender</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderMale" value="Male" required>
                        <label class="form-check-label" for="genderMale">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Female">
                        <label class="form-check-label" for="genderFemale">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderOther" value="Other">
                        <label class="form-check-label" for="genderOther">Other</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Qualification</label>
                    <select class="form-select" id="qualification" required>
                        <option value="">Select Qualification</option>
                        <option value="High School">High School</option>
                        <option value="Bachelor's">Bachelor's</option>
                        <option value="Master's">Master's</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Interests</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="interests" value="Coding">
                    <label class="form-check-label">Coding</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="interests" value="Design">
                    <label class="form-check-label">Design</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="interests" value="Gaming">
                    <label class="form-check-label">Gaming</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="interests" value="Sports">
                    <label class="form-check-label">Sports</label>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Class</label>
                    <input type="text" class="form-control" id="class" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" id="subject" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Marks</label>
                    <input type="number" class="form-control" id="marks" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Aadhaar Document Upload</label>
                <input class="form-control" type="file" id="aadhar" accept="application/pdf" required>
                <div class="form-text">Upload PDF only</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
