<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h2>Student Registration Portal</h2>
        <div><a href="login.html">Login</a></div>
    </div>
    <main class="login-container">
        <h3 class="text-center mb-4">Choose a new password</h3>
        <div id="reset-message" class="alert" style="display: none;"></div>
        <form id="reset-password-form">
            <div class="mb-3">
                <label for="new-password" class="form-label">New password</label>
                <input type="password" class="form-control" id="new-password" minlength="10" required autocomplete="new-password">
                <div class="form-text">Use at least 10 characters.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset password</button>
        </form>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
