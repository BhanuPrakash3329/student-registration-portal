<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h2>Student Dashboard</h2>
        <div><a href="index.html">Home</a><a href="#" onclick="event.preventDefault(); logout()">Logout</a></div>
    </div>
    <div class="card-container">
        <div class="welcome-banner" id="welcome-message">Welcome, User (User ID: #STU001)</div>
        <div class="d-flex justify-content-end mb-3"><button class="btn btn-info text-white" onclick="enableEdit()">Edit Profile</button></div>
        <form id="student-profile-form" enctype="multipart/form-data">
            <div id="error-msg" class="alert alert-danger"></div>
            <div id="success-msg" class="alert alert-success"></div>
            <div class="mb-3"><label><strong>Email:</strong> <span id="display-email"></span> 🔒</label></div>
            <div class="row mb-3">
                <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" class="form-control" id="name" required disabled></div>
                <div class="col-md-6"><label class="form-label">Date of Birth</label><input type="date" class="form-control" id="dob" required disabled></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Gender</label><br>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="genderMale" value="Male" disabled><label class="form-check-label" for="genderMale">Male</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Female" disabled><label class="form-check-label" for="genderFemale">Female</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="genderOther" value="Other" disabled><label class="form-check-label" for="genderOther">Other</label></div>
                </div>
                <div class="col-md-6"><label class="form-label">Qualification</label>
                    <select class="form-select" id="qualification" required disabled><option value="">Select Qualification</option><option value="High School">High School</option><option value="Bachelor's">Bachelor's</option><option value="Master's">Master's</option></select>
                </div>
            </div>
            <div class="mb-3"><label class="form-label">Interests</label><br>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="interests" value="Coding" disabled><label class="form-check-label">Coding</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="interests" value="Design" disabled><label class="form-check-label">Design</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="interests" value="Gaming" disabled><label class="form-check-label">Gaming</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="interests" value="Sports" disabled><label class="form-check-label">Sports</label></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4"><label class="form-label">Class</label><input type="text" class="form-control" id="class" required disabled></div>
                <div class="col-md-4"><label class="form-label">Subject</label><input type="text" class="form-control" id="subject" required disabled></div>
                <div class="col-md-4"><label class="form-label">Marks</label><input type="number" class="form-control" id="marks" required disabled></div>
            </div>
            <div class="mb-3"><label class="form-label">Aadhaar Document</label>
                <div id="current-aadhar-link" class="mb-2"></div>
                <div id="aadhar-upload-div" style="display: none;"><input class="form-control" type="file" id="aadhar" accept="application/pdf"><div class="form-text">Upload new PDF to replace current</div></div>
            </div>
            <button type="submit" id="save-btn" class="btn btn-success w-100" style="display: none;">Save Changes</button>
        </form>
    </div>
    <script src="js/main.js"></script>
    <script>document.addEventListener('DOMContentLoaded', loadStudentDashboard);</script>
</body>
</html>
