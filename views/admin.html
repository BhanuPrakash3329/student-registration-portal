<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h2>Admin Dashboard</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="#" onclick="event.preventDefault(); logout()">Logout</a>
        </div>
    </div>

    <div class="container mt-4">
        <h3 class="mb-4">Registered Students</h3>
        <div class="row mb-3">
            <div class="col-md-3"><input type="text" id="filter-name" class="form-control" placeholder="Filter by Name" oninput="filterStudents()"></div>
            <div class="col-md-3"><input type="text" id="filter-class" class="form-control" placeholder="Filter by Class" oninput="filterStudents()"></div>
            <div class="col-md-3"><input type="number" id="filter-age-min" class="form-control" placeholder="Min Age" oninput="filterStudents()"></div>
            <div class="col-md-3"><input type="number" id="filter-age-max" class="form-control" placeholder="Max Age" oninput="filterStudents()"></div>
        </div>
        <table class="table table-bordered table-striped" id="students-table">
            <thead class="table-dark">
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Age/DOB</th><th>Class</th><th>Aadhaar</th><th>Actions</th></tr>
            </thead>
            <tbody><!-- Populated by JS --></tbody>
        </table>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="admin-edit-form">
                    <input type="hidden" id="edit-id">
                    <div class="mb-2"><strong>Name:</strong> <span id="edit-name"></span> 🔒</div>
                    <div class="mb-3"><strong>Email:</strong> <span id="edit-email"></span> 🔒</div>
                    <div class="mb-2"><label>DOB</label><input type="date" class="form-control" id="edit-dob" required></div>
                    <div class="mb-2"><label>Gender</label>
                        <select class="form-select" id="edit-gender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
                    </div>
                    <div class="mb-2"><label>Qualification</label>
                        <select class="form-select" id="edit-qualification"><option value="High School">High School</option><option value="Bachelor's">Bachelor's</option><option value="Master's">Master's</option></select>
                    </div>
                    <div class="mb-2"><label>Interests</label><br>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="edit-interests" value="Coding"> Coding</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="edit-interests" value="Design"> Design</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="edit-interests" value="Gaming"> Gaming</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="edit-interests" value="Sports"> Sports</label>
                    </div>
                    <div class="mb-2"><label>Class</label><input type="text" class="form-control" id="edit-class" required></div>
                    <div class="mb-2"><label>Subject</label><input type="text" class="form-control" id="edit-subject" required></div>
                    <div class="mb-2"><label>Marks</label><input type="number" class="form-control" id="edit-marks" required></div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>document.addEventListener('DOMContentLoaded', loadAdminDashboard);</script>
</body>
</html>
